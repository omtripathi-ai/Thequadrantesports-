
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadrant Gaming Agency | Tournament Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-neon: #00ffcc;
            --secondary-neon: #7000ff;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Professional Dark Gaming Background */
            background: radial-gradient(circle at center, rgba(112, 0, 255, 0.15) 0%, transparent 70%),
                        linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)),
                        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2070');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* Top Accent Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-neon), var(--secondary-neon));
        }

        .logo-area {
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            letter-spacing: 1px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
        }

        /* WhatsApp Button Style */
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
        }

        /* Instagram Button Style */
        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #fff;
            box-shadow: 0 10px 20px rgba(220, 39, 67, 0.2);
        }

        .btn:hover {
            transform: scale(1.03);
            filter: brightness(1.1);
        }

        .footer-info {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        i {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-area">
            <h1>Quadrant</h1>
            <p class="tagline">Gaming Agency & Tournament Hub</p>
        </div>

        <div class="links-container">
            <a href="https://wa.me/917990133529?text=Hello%20Quadrant%20Gaming%2C%20I%20want%20tournament%20updates!" class="btn btn-whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> JOIN TOURNAMENT GROUP
            </a>

            <a href="https://www.instagram.com/quadrantgamingagency?igsh=NHRhb3hjYnNuOXAy" class="btn btn-insta" target="_blank">
                <i class="fab fa-instagram"></i> FOLLOW ON INSTAGRAM
            </a>
        </div>

        <div class="footer-info">
            Verified Gaming Community
        </div>
    </div>

</body>
</html>
